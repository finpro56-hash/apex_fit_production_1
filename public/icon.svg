<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a1a"/>
      <stop offset="50%" stop-color="#07221e"/>
      <stop offset="100%" stop-color="#041312"/>
    </linearGradient>
    <linearGradient id="squircleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#144d42"/>
      <stop offset="100%" stop-color="#0a2a24"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Inner Squircle Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#squircleGrad)" stroke="#10b981" stroke-width="4" stroke-opacity="0.3" />

  <!-- Angled Dumbbell Graphic -->
  <g transform="translate(256, 256) rotate(-45) translate(-256, -256)" filter="url(#glow)">
    <!-- Central Bar -->
    <rect x="236" y="160" width="40" height="192" rx="12" fill="#10b981" />
    
    <!-- Top Weights -->
    <rect x="206" y="130" width="100" height="30" rx="12" fill="url(#neonGrad)" />
    <rect x="186" y="90" width="140" height="32" rx="14" fill="url(#neonGrad)" />
    
    <!-- Bottom Weights -->
    <rect x="206" y="352" width="100" height="30" rx="12" fill="url(#neonGrad)" />
    <rect x="186" y="390" width="140" height="32" rx="14" fill="url(#neonGrad)" />
  </g>
</svg>
